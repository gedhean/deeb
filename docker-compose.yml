services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: deeb-postgres
    environment:
      POSTGRES_USER: deeb
      POSTGRES_PASSWORD: deeb_dev_password
      POSTGRES_DB: deeb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeb -d deeb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deeb-network

  # Backend API Server (optional - for full stack development)
  # Uncomment to run backend in Docker
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: deeb-backend
  #   environment:
  #     DATABASE_URL: postgresql://deeb:deeb_dev_password@postgres:5432/deeb?sslmode=disable
  #     SERVER_PORT: 8080
  #     SERVER_HOST: 0.0.0.0
  #     LOG_LEVEL: debug
  #     LOG_FORMAT: json
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - deeb-network
  #   volumes:
  #     - ./backend:/app
  #   command: ["go", "run", "./cmd/server"]

volumes:
  postgres_data:
    driver: local

networks:
  deeb-network:
    driver: bridge
