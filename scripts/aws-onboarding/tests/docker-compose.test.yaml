# Local test stack for the multi-account onboarder e2e.
# - moto: mocks AWS (STS assume-role, Secrets Manager, RDS describe).
# - target-mysql / target-postgres: stand in for the "RDS" databases the sweep onboards.
#
# Deeb itself is NOT here — run it separately (see tests/README.md) and pass its URL/token.
services:
  moto:
    image: motoserver/moto:5.1.0
    # Host port 5001 (5000 is commonly taken on macOS by AirPlay Receiver).
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 3s
      timeout: 3s
      retries: 20

  target-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: master
    # Host port 3307 (3306 is commonly taken by a native MySQL bound to 127.0.0.1).
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmaster"]
      interval: 3s
      timeout: 3s
      retries: 30

  target-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: master
    # Host port 5433 to avoid clashing with Deeb's own Postgres on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
