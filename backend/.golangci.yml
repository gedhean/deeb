# golangci-lint configuration for Deeb backend
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true
  allow-parallel-runners: true
  go: '1.25.3'

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (*database/sql.Rows).Close
      - (*database/sql.DB).Close

  govet:
    enable-all: true
    settings:
      shadow:
        strict: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/nsxbet/deeb

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - whyNoLint  # We want to enforce why nolint comments
      - unnamedResult  # Allow unnamed results for small functions

  gocyclo:
    min-complexity: 15

  misspell:
    locale: US

  lll:
    line-length: 140
    tab-width: 4

  unused:
    check-exported: false

  unparam:
    check-exported: true

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: true

  nolintlint:
    require-explanation: true
    require-specific: true

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"
      - name: package-comments
      - name: indent-error-flow
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Audit errors not checked - handled by errcheck
      - G304  # File path injection - we validate paths

  staticcheck:
    checks: ["all"]

linters:
  enable:
    # Enabled by default
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - bodyclose
    - dogsled
    - dupl
    - exportloopref
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - mispell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace

    # Security
    - gosec

    # Performance
    - prealloc

  disable:
    - exhaustruct  # Too strict for common structs
    - gochecknoglobals  # We use globals sparingly but appropriately
    - godox  # We want to allow TODO/FIXME comments
    - testpackage  # Tests in same package is fine
    - wrapcheck  # Too verbose for our error handling
    - nlreturn  # Stylistic preference
    - wsl  # Whitespace linter too opinionated
    - gomnd  # Magic number detection too strict
    - paralleltest  # Not all tests should be parallel
    - funlen  # Function length checks too strict
    - cyclop  # Cyclomatic complexity covered by gocyclo

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - gosec
        - dupl
        - goconst

    # Exclude generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all

    # Exclude vendor
    - path: vendor/
      linters:
        - all

  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Show all issues
  exclude-use-default: false

severity:
  default-severity: error
  rules:
    - linters:
        - revive
      severity: warning
