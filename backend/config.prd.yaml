# Deeb Configuration Example
# Copy this file to config.yaml and customize for your environment
server:
  host: 0.0.0.0  # Server bind address
  port: 8080  # Server port
  read_timeout: 10s  # HTTP read timeout
  write_timeout: 10s  # HTTP write timeout
  shutdown_timeout: 30s  # Graceful shutdown timeout
  cors_origins: ['https://deeb.nsx.services']
  frontend_url: https://deeb.nsx.services  # Frontend URL for OAuth redirects
auth:
  jwt_expiration: 24h  # JWT token expiration
  callback_url: https://deeb.nsx.services/api/v1/auth/google/callback  # OAuth callback URL
  require_2fa: false  # Require 2FA for all users
security:
  bcrypt_cost: 12  # Bcrypt hashing cost (10-31, higher is more secure but slower)
  rate_limit_enabled: true  # Enable rate limiting
  rate_limit_requests: 200  # Number of requests allowed
  rate_limit_window: 1m  # Rate limit time window
logging:
  level: debug  # Log level: debug, info, warn, error
  format: console  # Log format: json, console
  output: stdout  # Log output: stdout, stderr, file
  file_path: ''  # Log file path (if output is file)
background_jobs:
  schema_sync_interval: 15m  # How often to sync database schema metadata (e.g., 30m, 1h, 2h)
# Audit Logging Configuration
# Controls what resources and actions are logged to the audit trail
audit_logging:
  enabled: true  # Enable/disable audit logging globally
  default_policy: deny  # Default policy: "allow" (log everything unless disabled) or "deny" (log nothing unless enabled)
  log_all_paths: false  # If true, don't skip any paths (overrides hardcoded skip rules for health checks, static assets)
  redaction_enabled: true  # Enable automatic redaction of sensitive data (passwords, tokens, etc.)
  # Custom paths to skip (supports wildcards with * at the end)
  skip_paths:
    - /metrics
    - /debug/*
  # Per-resource configuration
  # Define which resources should be audited and which actions to log
  resources:
    # User resource - logs authentication and user management
    user:
      enabled: true
      actions:
        - login
        - logout
        - register
        - create_user
        - update_user
        - delete_user
        - update_user_role
    # Change Plan resource - logs database change workflow
    change_plan:
      enabled: true
      actions:
        # Generic CRUD actions (used for standard HTTP methods like POST, GET, PUT, DELETE)
        - create  # For POST /api/v1/change-plans
        - update  # For PUT/PATCH /api/v1/change-plans/:id
        - delete  # For DELETE /api/v1/change-plans/:id
        # Specific workflow actions (detected by path suffix in middleware)
        - approve_change_plan  # For POST /api/v1/change-plans/:id/approve
        - reject_change_plan  # For POST /api/v1/change-plans/:id/reject
        - close_change_plan  # For POST /api/v1/change-plans/:id/close
        - execute_change_plan  # For POST /api/v1/change-plans/:id/execute
    # Project resource - logs project management
    project:
      enabled: true
      actions:
        # Specific project actions
        - create_project
        - update_project
        - delete_project
        - add_project_member
        - remove_project_member
        - update_project_member_role
    # Database resource - logs database and instance management
    database:
      enabled: true
      actions:
        - create_database
        - update_database
        - delete_database
    # Database Instance resource
    database_instance:
      enabled: true
      actions:
        - create_database_instance
        - update_database_instance
        - delete_database_instance
    # Environment resource - logs environment management
    environment:
      enabled: true
      actions:
        - create_environment
        - update_environment
        - delete_environment
    # Policy resource - logs policy management
    policy:
      enabled: true
      actions: [create_policy, update_policy, delete_policy]
