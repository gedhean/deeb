        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangePlanRequest'
            example:
              project_id: 123e4567-e89b-12d3-a456-426614174000
              target_database_id: 223e4567-e89b-12d3-a456-426614174001
              title: Add user table
              description: Create users table with email and password fields
              change_type: DDL
              sql_content: CREATE TABLE users (id UUID PRIMARY KEY, email VARCHAR(255) UNIQUE, password_hash VARCHAR(255));
              rollback_sql: DROP TABLE IF EXISTS users;
      responses:
        '201':
          description: Change plan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
