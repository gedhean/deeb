        '200':
          description: Change plan closed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Change plan closed successfully
                  change_plan_id:
                    type: string
                    format: uuid
                    example: 123e4567-e89b-12d3-a456-426614174000
              example:
                message: Change plan closed successfully
                change_plan_id: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Bad Request - Invalid status or already approved/closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Cannot close change plan that is not in Open status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/change-plans/{id}/execute:
    post:
      tags: [Change Plans]
      summary: Execute change plan
      description: |
        Execute a change plan against the target database. Only Approved status change plans
        can be executed. SQL Review errors block execution as a safety check.

        Execution workflow:
        1. Acquires database-level execution lock (prevents concurrent executions on same database)
        2. Captures before schema snapshot
        3. Executes SQL within a SERIALIZABLE transaction with timeout
        4. On success: captures after schema snapshot, updates status to Completed
        5. On failure: rolls back transaction, updates status to Failed
        6. Releases execution lock

        Requires execution permissions (Organization Admin, Organization DBA, Project Owner, or Change Plan Author).

        If the database is locked by another execution, the change plan will be queued and
        a 409 Conflict response is returned with queue position information.
      operationId: executeChangePlan
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Change plan ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Change plan executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteChangePlanResponse'
              example:
                change_plan:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  status: completed
                  title: Add user table
                  executed_at: '2025-01-26T12:00:00Z'
                  execution_duration_ms: 1250
                  affected_rows: 5
                execution:
                  success: true
                  rows_affected: 5
                  duration_ms: 1250
        '400':
          description: Bad Request - Invalid status, SQL Review errors exist, or execution validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Cannot execute change plan with SQL Review errors
                  details:
                    type: object
                    properties:
                      error_count:
                        type: integer
                        example: 2
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/PolicyFinding'
              example:
                error: Cannot execute change plan with SQL Review errors
                details:
                  error_count: 2
                  errors:
                    - validator_type: syntax
                      rule_name: PostgreSQL Syntax Check
                      message: Syntax error at line 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict - Database is locked by another execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Database is currently locked by another execution
                  queued:
                    type: boolean
                    example: true
                  queue_position:
                    type: integer
                    nullable: true
                    example: 2
                  queue_status:
                    type: string
                    example: pending
              example:
                error: Database is currently locked by another execution
                queued: true
                queue_position: 2
                queue_status: pending
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/change-plans/{id}/resubmit:
    post:
      tags: [Change Plans]
      summary: Resubmit change plan
      description: |
        Resubmit a change plan by moving it from Open back to Draft status.
        Clears existing policy findings. Only the author can resubmit.
      operationId: resubmitChangePlan
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Change plan ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Change plan resubmitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
