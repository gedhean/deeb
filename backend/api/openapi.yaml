          in: query
          description: Filter by project ID
          schema:
            type: string
            format: uuid
        - name: database_id
          in: query
          description: Filter by target database ID
          schema:
            type: string
            format: uuid
        - name: author_id
          in: query
          description: Filter by author ID
          schema:
            type: string
