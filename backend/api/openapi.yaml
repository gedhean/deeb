    post:
      tags: [Change Plans]
      summary: Approve change plan
      description: |
        Approve a change plan. Only Open status change plans can be approved.
        SQL Review errors block approval. Requires Project Approver role or higher
        (Organization Admin, Organization DBA, Project Owner).
      operationId: approveChangePlan
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Change plan ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveChangePlanRequest'
            example:
              comments: "Approved - looks good to deploy"
      responses:
        '200':
          description: Change plan approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Change plan approved successfully
                  change_plan_id:
                    type: string
                    format: uuid
                    example: 123e4567-e89b-12d3-a456-426614174000
              example:
                message: Change plan approved successfully
                change_plan_id: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Bad Request - Invalid status, already approved/closed, or SQL Review errors exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Cannot approve change plan with SQL Review errors
                  details:
                    type: object
                    properties:
                      message:
                        type: string
                        example: SQL Review found 2 errors that must be resolved
              example:
                error: Cannot approve change plan with SQL Review errors
                details:
                  message: SQL Review found 2 errors that must be resolved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
