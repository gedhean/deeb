components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT token stored in HttpOnly cookie
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2025-01-26T12:00:00Z'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User password (minimum 8 characters)
          example: SecureP@ssw0rd
        organization_role:
          type: string
          enum: [admin, senior_developer, developer, read_only]
          description: |
            Role within the organization. First registered user becomes admin automatically.
          example: developer
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User password
          example: SecureP@ssw0rd
    LoginResponse:
      type: object
      required: [user]
      properties:
        token:
          type: string
          deprecated: true
          description: |
            JWT token (deprecated - token is now set as HttpOnly cookie)
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, email, organization_role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        organization_role:
          type: string
          enum: [admin, senior_developer, developer, read_only]
          description: User's role within the organization
          example: developer
        google_id:
          type: string
          nullable: true
          description: Google OAuth user ID (if authenticated via Google)
          example: '1234567890'
        is_active:
          type: boolean
          description: Whether the user account is active
          example: true
        created_at:
          type: string
          format: date-time
          description: Timestamp when user was created
          example: '2025-01-26T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when user was last updated
          example: '2025-01-26T12:30:00Z'
    UserListResponse:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        total:
          type: integer
          description: Total number of users
          example: 42
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 20
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: New email address
          example: newemail@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: New password (minimum 8 characters)
          example: NewSecureP@ssw0rd
        organization_role:
          type: string
          enum: [admin, senior_developer, developer, read_only]
          description: New organization role
          example: senior_developer
        is_active:
          type: boolean
          description: Whether the user account is active
          example: true
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Success or informational message
          example: Operation completed successfully
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message
          example: Invalid request parameters
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Project name
          example: My Project
        description:
          type: string
          maxLength: 500
          description: Project description
          example: A project for managing database changes
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Project name
          example: Updated Project Name
        description:
          type: string
          maxLength: 500
          description: Project description
          example: Updated description
    ProjectResponse:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique project identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Project name
          example: My Project
        description:
          type: string
          description: Project description
          example: A project for managing database changes
        created_at:
          type: string
          format: date-time
          description: Timestamp when project was created
          example: '2025-01-26T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when project was last updated
          example: '2025-01-26T12:30:00Z'
    ProjectListResponse:
      type: object
      required: [projects, total, limit, offset]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        total:
          type: integer
          description: Total number of projects
          example: 10
        limit:
          type: integer
          description: Number of items per page
          example: 100
        offset:
          type: integer
          description: Number of items skipped
          example: 0
    AddProjectMemberRequest:
      type: object
      required: [user_id, project_role]
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID to add as member
          example: 123e4567-e89b-12d3-a456-426614174000
        project_role:
          type: string
          enum: [ProjectOwner, ProjectDeveloper, ProjectApprover, ProjectViewer]
          description: Role for the user in the project
          example: ProjectDeveloper
    UpdateProjectMemberRequest:
      type: object
      required: [project_role]
      properties:
        project_role:
          type: string
          enum: [ProjectOwner, ProjectDeveloper, ProjectApprover, ProjectViewer]
          description: New role for the user in the project
          example: ProjectApprover
    ProjectMemberResponse:
      type: object
      required: [id, project_id, user_id, role, added_by_id, added_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique project member identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        project_id:
          type: string
          format: uuid
          description: Project ID
          example: 223e4567-e89b-12d3-a456-426614174001
        user_id:
          type: string
          format: uuid
          description: User ID
          example: 323e4567-e89b-12d3-a456-426614174002
        role:
          type: string
          enum: [ProjectOwner, ProjectDeveloper, ProjectApprover, ProjectViewer]
          description: Role in the project
          example: ProjectDeveloper
        added_by_id:
          type: string
          format: uuid
          description: User ID who added this member
          example: 423e4567-e89b-12d3-a456-426614174003
        added_at:
          type: string
          format: date-time
          description: Timestamp when member was added
          example: '2025-01-26T12:00:00Z'
    ProjectMemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMemberResponse'
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Environment name
          example: Production
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Environment description
          example: Production environment
        policy_id:
          type: string
          format: uuid
          nullable: true
          description: Policy ID to associate with this environment
          example: 123e4567-e89b-12d3-a456-426614174000
    UpdateEnvironmentRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Environment name
          example: Updated Environment
        description:
          type: string
          nullable: true
          description: Environment description
          example: Updated description
        policy_id:
          type: string
          format: uuid
          nullable: true
          description: Policy ID to associate with this environment
          example: 123e4567-e89b-12d3-a456-426614174000
    EnvironmentResponse:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique environment identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Environment name
          example: Production
        description:
          type: string
          nullable: true
          description: Environment description
          example: Production environment
        policy_id:
          type: string
          format: uuid
          nullable: true
          description: Associated policy ID
          example: 223e4567-e89b-12d3-a456-426614174001
        created_at:
          type: string
          format: date-time
          description: Timestamp when environment was created
          example: '2025-01-26T12:00:00Z'
        updated_at:
          type: string
