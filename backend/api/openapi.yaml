openapi: 3.0.3
info:
  title: Deeb API
  description: |
    Secure database change management tool that enables developers to manage database changes
    without requiring direct database access.

    ## Authentication
    Most endpoints require authentication via JWT tokens. After successful login, a JWT token
    is set as an HttpOnly cookie named `token`. This cookie is automatically included in
    subsequent requests.

    ## Error Responses
    All endpoints may return standard error responses:
    - 400 Bad Request - Invalid request parameters
    - 401 Unauthorized - Authentication required or token invalid
    - 403 Forbidden - Insufficient permissions
    - 404 Not Found - Resource not found
    - 500 Internal Server Error - Server error
  version: 1.0.0
  contact:
    name: Deeb API Support
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.deeb.example.com
    description: Production server
tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication and registration
  - name: Users
    description: User management operations
  - name: Projects
    description: Project management operations
  - name: Environments
    description: Environment management operations
  - name: Policies
    description: Policy management operations
  - name: Database Instances
    description: Database instance management operations
  - name: Databases
    description: Database management operations
  - name: Project Members
    description: Project membership management operations
  - name: Change Plans
    description: Change plan management and SQL review operations
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check if the API server is healthy and responding
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: '2025-01-26T12:00:00Z'
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: |
        Create a new user account. The first user registered automatically becomes
        an organization admin.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: SecureP@ssw0rd
              organization_role: developer
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  email: user@example.com
                  organization_role: developer
                  is_active: true
                  created_at: '2025-01-26T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      description: |
        Authenticate a user with email and password. On success, sets an HttpOnly
        cookie containing the JWT token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecureP@ssw0rd
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: JWT token in HttpOnly cookie
              schema:
                type: string
                example: token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  id: 123e4567-e89b-12d3-a456-426614174000
                  email: user@example.com
                  organization_role: developer
                  is_active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: |
        Logout the current user by clearing the authentication cookie.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Cleared authentication cookie
              schema:
                type: string
                example: token=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/google:
    get:
      tags: [Authentication]
      summary: Initiate Google OAuth
      description: |
        Redirect to Google OAuth consent screen to initiate authentication flow.
      operationId: googleOAuth
      responses:
        '302':
          description: Redirect to Google OAuth
          headers:
            Location:
              description: Google OAuth consent URL
              schema:
                type: string
                example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      summary: Google OAuth callback
      description: |
        Handle the callback from Google OAuth. On success, sets an HttpOnly cookie
        containing the JWT token and redirects to the application.
      operationId: googleOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter for CSRF protection
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application with authentication cookie set
          headers:
            Set-Cookie:
              description: JWT token in HttpOnly cookie
              schema:
                type: string
            Location:
              description: Application URL
              schema:
                type: string
                example: http://localhost:3000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: |
        Retrieve the profile information of the currently authenticated user.
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                email: user@example.com
                organization_role: developer
                is_active: true
                created_at: '2025-01-26T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users:
    get:
      tags: [Users]
      summary: List all users
      description: |
        Retrieve a list of all users in the organization. Requires authentication.
      operationId: listUsers
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                users:
                  - id: 123e4567-e89b-12d3-a456-426614174000
                    email: user1@example.com
                    organization_role: admin
                    is_active: true
                    created_at: '2025-01-26T12:00:00Z'
                  - id: 223e4567-e89b-12d3-a456-426614174001
                    email: user2@example.com
                    organization_role: developer
                    is_active: true
                    created_at: '2025-01-26T12:00:00Z'
                total: 2
                page: 1
                limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: |
        Retrieve detailed information about a specific user.
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                email: user@example.com
                organization_role: developer
                is_active: true
                created_at: '2025-01-26T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Update user
      description: |
        Update user information. Users can update their own profile, or admins
        can update any user.
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: newemail@example.com
              organization_role: senior_developer
              is_active: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                email: newemail@example.com
                organization_role: senior_developer
                is_active: true
                updated_at: '2025-01-26T12:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Delete user
      description: |
        Soft delete a user by setting is_active to false. Requires admin permissions.
      operationId: deleteUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '204':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/projects:
    post:
      tags: [Projects]
      summary: Create a new project
      description: |
        Create a new project. Requires Organization Admin or DBA role.
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Projects]
      summary: List all projects
      description: |
        Retrieve a paginated list of all projects. Requires Organization Admin role.
      operationId: listProjects
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      description: |
        Retrieve detailed information about a specific project.
      operationId: getProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Projects]
      summary: Update project
      description: |
        Update project information. Requires Organization Admin role.
      operationId: updateProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Projects]
      summary: Delete project
      description: |
        Delete a project. Cannot delete if databases exist. Requires Organization Admin role.
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/projects/{id}/members:
    post:
      tags: [Project Members]
      summary: Add member to project
      description: |
        Add a user as a member to a project with a specific role. Requires Project Owner or Organization Admin role.
      operationId: addProjectMember
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Member already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Project Members]
      summary: List project members
      description: |
        Retrieve all members of a project. Requires Project Owner or Organization Admin role.
      operationId: listProjectMembers
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/projects/{id}/members/{user_id}:
    put:
      tags: [Project Members]
      summary: Update project member role
      description: |
        Update the role of a project member. Requires Project Owner or Organization Admin role.
      operationId: updateProjectMemberRole
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberRequest'
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Project Members]
      summary: Remove member from project
      description: |
        Remove a member from a project. Cannot remove the last Project Owner. Requires Project Owner or Organization Admin role.
      operationId: removeProjectMember
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID (UUID)
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/environments:
    post:
      tags: [Environments]
      summary: Create a new environment
      description: |
        Create a new environment (e.g., Dev, Staging, Production). Requires Organization Admin role.
      operationId: createEnvironment
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Environments]
      summary: List all environments
      description: |
        Retrieve a paginated list of all environments. Requires Organization Admin role.
      operationId: listEnvironments
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/environments/{id}:
    get:
      tags: [Environments]
      summary: Get environment by ID
      description: |
        Retrieve detailed information about a specific environment.
      operationId: getEnvironment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Environment ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Environment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Environments]
      summary: Update environment
      description: |
        Update environment information. Requires Organization Admin role.
      operationId: updateEnvironment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Environment ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Environments]
      summary: Delete environment
      description: |
        Delete an environment. Cannot delete if databases exist. Requires Organization Admin role.
      operationId: deleteEnvironment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Environment ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Environment deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
