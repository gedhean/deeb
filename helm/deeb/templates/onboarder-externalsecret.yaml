{{- if and .Values.onboarder.enabled .Values.onboarder.externalSecret.enabled }}
# Syncs the Deeb API token (a deeb_pat_ service-account token) from AWS Secrets Manager
# into a k8s Secret the CronJob mounts as DEEB_API_TOKEN.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "deeb.fullname" . }}-onboarder-secret
  labels:
    {{- include "deeb.onboarder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
  target:
    # Kept in sync with the CronJob's secretKeyRef (onboarder-cronjob.yaml).
    name: {{ .Values.onboarder.apiTokenSecret.name | default (printf "%s-onboarder-secret" (include "deeb.fullname" .)) }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.onboarder.apiTokenSecret.key | default "DEEB_API_TOKEN" }}
      remoteRef:
        key: {{ .Values.onboarder.externalSecret.remoteKey }}
        property: {{ .Values.onboarder.externalSecret.remoteProperty | default "deeb_api_token" }}
{{- end }}
