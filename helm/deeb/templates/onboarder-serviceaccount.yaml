{{- if .Values.onboarder.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deeb.onboarder.serviceAccountName" . }}
  labels:
    {{- include "deeb.onboarder.labels" . | nindent 4 }}
  {{- with .Values.onboarder.serviceAccount.annotations }}
  annotations:
    # IRSA: set eks.amazonaws.com/role-arn to a role allowing rds:Describe*,
    # rds:ListTagsForResource and secretsmanager:GetSecretValue.
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
