apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deeb.fullname" . }}-backend-config
  labels:
    {{- include "deeb.backend.labels" . | nindent 4 }}
data:
  # Database configuration
  database.host: {{ include "deeb.postgresql.serviceName" . | quote }}
  database.port: "5432"
  database.user: {{ .Values.postgresql.auth.username | quote }}
  database.database: {{ .Values.postgresql.auth.database | quote }}
  database.sslMode: "require"

  # Server configuration
  server.host: {{ .Values.backend.config.server.host | quote }}
  server.port: {{ .Values.backend.config.server.port | quote }}
  server.corsOrigins: {{ include "deeb.corsOrigins" . | quote }}
  server.frontendUrl: {{ include "deeb.frontendUrl" . | quote }}

  # Auth configuration
  auth.callbackUrl: {{ include "deeb.callbackUrl" . | quote }}

  # Logging configuration
  logging.level: {{ .Values.backend.config.logging.level | quote }}
  logging.format: {{ .Values.backend.config.logging.format | quote }}

  # Full config.yaml file
  config.yaml: |
    server:
      host: {{ .Values.backend.config.server.host }}
      port: {{ .Values.backend.config.server.port }}
      read_timeout: {{ .Values.backend.config.server.readTimeout }}
      write_timeout: {{ .Values.backend.config.server.writeTimeout }}
      shutdown_timeout: {{ .Values.backend.config.server.shutdownTimeout }}
      cors_origins: {{ include "deeb.corsOrigins" . }}
      frontend_url: {{ include "deeb.frontendUrl" . | quote }}

    database:
      host: {{ include "deeb.postgresql.serviceName" . | quote }}
      port: 5432
      user: {{ .Values.postgresql.auth.username | quote }}
      database: {{ .Values.postgresql.auth.database | quote }}
      ssl_mode: "require"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: "5m"

    auth:
      jwt_expiration: "24h"
      callback_url: {{ include "deeb.callbackUrl" . | quote }}
      require_2fa: false

    security:
      bcrypt_cost: {{ .Values.backend.config.security.bcryptCost }}
      rate_limit_enabled: {{ .Values.backend.config.security.rateLimitEnabled }}
      rate_limit_requests: {{ .Values.backend.config.security.rateLimitRequests }}
      rate_limit_window: {{ .Values.backend.config.security.rateLimitWindow | quote }}

    logging:
      level: {{ .Values.backend.config.logging.level | quote }}
      format: {{ .Values.backend.config.logging.format | quote }}
      output: {{ .Values.backend.config.logging.output | quote }}

    background_jobs:
      schema_sync_interval: {{ .Values.backend.config.backgroundJobs.schemaSyncInterval | quote }}

    audit_logging:
      enabled: {{ .Values.backend.config.auditLogging.enabled }}
      default_policy: {{ .Values.backend.config.auditLogging.defaultPolicy | quote }}
      log_all_paths: {{ .Values.backend.config.auditLogging.logAllPaths }}
      redaction_enabled: {{ .Values.backend.config.auditLogging.redactionEnabled }}
