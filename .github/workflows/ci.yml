name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Phase 5: Cancel in-progress runs when new commits are pushed to the same PR
# This saves CI resources and provides faster feedback
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Phase 4: Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run on main branch, only use filters on PRs
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      onboarder: ${{ steps.filter.outputs.onboarder }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: nsx-actions/dorny_paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            onboarder:
              - 'scripts/aws-onboarding/**'
              - '.github/workflows/ci.yml'

  # Unit + integration tests. Kept together so they share the module and
  # build caches (splitting them would double the ~45s setup-go overhead).
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Phase 4: Only run when backend code changes, or always on main branch
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Phase 2: Optimize Go caching using setup-go's built-in cache parameter
      # This is more efficient than using a separate cache action
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # Phase 2: Cache Go build artifacts (incl. test binaries) to speed up
      # compilation. The key is run-unique so every run writes a fresh entry,
      # while restore-keys always restores the most recent one — the build cache
      # is content-addressed, so a slightly-stale restore still compiles
      # incrementally instead of from scratch on every code change.
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Install dependencies
        run: go mod download

      # Phase 6: Run tests with parallel execution
      - name: Run unit tests
        run: make test

      # Run integration tests with testcontainers (single shared Postgres
      # container is booted once for the whole package; see TestMain)
      - name: Run integration tests
        run: make test-integration
        env:
          # Testcontainers needs Docker
          TESTCONTAINERS_RYUK_DISABLED: false

  # Linting runs in parallel with tests for faster, clearer failure signal.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # Phase 2: Cache golangci-lint data to speed up linting
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      # Phase 2: Cache CI tools (linting and formatting tools installed via go install)
      - name: Cache CI tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('backend/scripts/ci/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install dependencies
        run: go mod download

      - name: Run linting
        run: make lint

  frontend:
    name: Frontend Tests and Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase 4: Only run when frontend code changes, or always on main branch
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: nsx-actions/pnpm_action-setup@v4
        with:
          version: 9

      # Phase 3: Node.js caching is already optimized with pnpm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Phase 3: Use frozen lockfile for faster, more reliable installs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      # Fast type-check (tsc --noEmit) instead of a full vite build on PRs
      - name: Run type checking
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      # Full production build (Monaco, 4GB heap) is expensive; only run it on
      # merges to main to catch bundling regressions before release.
      - name: Build production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run build

  onboarder:
    name: Onboarder Logic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.onboarder == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: scripts/aws-onboarding

    steps:
      # Onboarder job: no Git operations after checkout, so don't persist the
      # token in .git/config (defense-in-depth for PR runs).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pyyaml

      # Stubs AWS/DB/HTTP deps; validates config parsing, tag filtering, assume-role
      # selection, and name disambiguation. See tests/README.md.
      - name: Run onboarder logic tests
        run: python tests/test_sweep.py

  # Phase 1: Add status check job for branch protection
  # This provides a single merge gate that depends on all other jobs
  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, backend-test, backend-lint, frontend, onboarder]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # A job is considered passing if it succeeded or was skipped
          changes_ok=false
          backend_test_ok=false
          backend_lint_ok=false
          frontend_ok=false
          onboarder_ok=false

          if [[ "${{ needs.changes.result }}" == "success" ]] || [[ "${{ needs.changes.result }}" == "skipped" ]]; then
            changes_ok=true
          fi

          if [[ "${{ needs.backend-test.result }}" == "success" ]] || [[ "${{ needs.backend-test.result }}" == "skipped" ]]; then
            backend_test_ok=true
          fi

          if [[ "${{ needs.backend-lint.result }}" == "success" ]] || [[ "${{ needs.backend-lint.result }}" == "skipped" ]]; then
            backend_lint_ok=true
          fi

          if [[ "${{ needs.frontend.result }}" == "success" ]] || [[ "${{ needs.frontend.result }}" == "skipped" ]]; then
            frontend_ok=true
          fi

          if [[ "${{ needs.onboarder.result }}" == "success" ]] || [[ "${{ needs.onboarder.result }}" == "skipped" ]]; then
            onboarder_ok=true
          fi

          echo "Changes: ${{ needs.changes.result }}"
          echo "Backend Tests: ${{ needs.backend-test.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Onboarder: ${{ needs.onboarder.result }}"

          if [[ "$changes_ok" == "true" ]] && [[ "$backend_test_ok" == "true" ]] && [[ "$backend_lint_ok" == "true" ]] && [[ "$frontend_ok" == "true" ]] && [[ "$onboarder_ok" == "true" ]]; then
            echo "✓ All jobs passed or were skipped"
            exit 0
          else
            echo "✗ One or more jobs failed"
            exit 1
          fi
