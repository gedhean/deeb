name: 'Charts: Lint'

on:
  pull_request:
    paths:
      - 'helm/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Charts with Kubeconform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: nsx-actions/azure_setup-helm@v3
        with:
          version: v3.12.3

      - name: Install kubeconform-helm plugin
        run: |
          helm plugin install https://github.com/jtyr/kubeconform-helm

      - name: Detect changed charts
        id: changed-charts
        run: |
          echo "🔍 Detecting changed charts..."

          # ─────────────────────────────────────────────────────
          # Get changed files in helm directory
          # ─────────────────────────────────────────────────────
          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED_FILES=$(git diff --name-only $BASE_REF...HEAD | grep "^helm/" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "⚠️  No chart changes detected"
            echo "charts=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ─────────────────────────────────────────────────────
          # Extract unique chart names
          # ─────────────────────────────────────────────────────
          CHART_NAMES=""
          for file in $CHANGED_FILES; do
            if [[ $file =~ ^helm/([^/]+)/ ]]; then
              CHART_NAME="${BASH_REMATCH[1]}"
              CHART_NAMES="$CHART_NAMES $CHART_NAME"
            fi
          done

          CHART_NAMES=$(echo "$CHART_NAMES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
          echo "📦 Changed charts: $CHART_NAMES"
          echo "charts=$CHART_NAMES" >> $GITHUB_OUTPUT

      - name: Run kubeconform
        env:
          CHANGED_CHARTS: ${{ steps.changed-charts.outputs.charts }}
        run: |
          if [ -z "$CHANGED_CHARTS" ]; then
            echo "✅ No charts to lint"
            exit 0
          fi

          # ─────────────────────────────────────────────────────
          # Lint each changed chart
          # ─────────────────────────────────────────────────────
          for CHART_NAME in $CHANGED_CHARTS; do
            echo ""
            echo "================================================"
            echo "🔍 Linting chart: $CHART_NAME"
            echo "================================================"

            CHART_PATH="helm/${CHART_NAME}"

            if [ ! -d "$CHART_PATH" ]; then
              echo "⚠️  Chart directory not found: $CHART_PATH"
              continue
            fi

            cd "$CHART_PATH"
            helm kubeconform --summary --verbose .
            cd - > /dev/null

            echo "✅ Lint completed for $CHART_NAME"
          done
